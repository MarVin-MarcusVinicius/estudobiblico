<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#11203a"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <radialGradient id="g2" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5a4" stop-opacity="0.06"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend mode="overlay"/>
    </filter>
  </defs>

  <!-- Fondo de gradiente oscuro -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Capas suaves de color -->
  <rect width="120%" height="120%" x="-10%" y="-10%" fill="url(#g2)" transform="rotate(-15 800 450)" opacity="0.7"/>
  <rect width="100%" height="100%" fill="url(#g2)" opacity="0.22"/>

  <!-- Figuras abstractas suaves -->
  <g fill="#ffffff" opacity="0.03">
    <circle cx="1200" cy="180" r="260" />
    <circle cx="300" cy="700" r="380" />
    <ellipse cx="900" cy="450" rx="520" ry="220" />
  </g>

  <!-- Textura ligera para profundidad -->
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.04"/>

</svg>
